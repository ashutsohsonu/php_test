# ============================================
# docker-compose.yml
# ============================================
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurant-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - restaurant-network
    environment:
      - DATABASE_URL=mysql://symfony:secret@mysql:3306/restaurant_orders
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: restaurant-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - restaurant-network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: restaurant-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: restaurant_orders
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: symfony
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - restaurant-network
    command: --default-authentication-plugin=mysql_native_password

networks:
  restaurant-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local

